# Production profile: secrets MUST come from the environment (.env on the server).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jackson.serialization.indent_output=false

# Refuse to start without an API key
pricing.security.require-api-key=true
pricing.demo-mode=false

# Swagger UI off in prod by default (enable with SPRINGDOC_SWAGGER_UI_ENABLED=true)
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}

logging.level.root=INFO
logging.level.org.springframework.web=WARN
