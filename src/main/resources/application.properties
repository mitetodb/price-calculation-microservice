spring.application.name=price-calculation-microservice
# Profile: demo (default, local), prod (server). Override with SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}

# Server
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api

# Actuator: only health + info are exposed (env/metrics could leak config)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.jackson.serialization.indent_output=true

# Database - all values come from environment variables (see .env.example)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/testpurchase_rest_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# API key protection (header X-API-Key). Empty = disabled (local dev only).
pricing.security.api-key=${PRICING_API_KEY:}
pricing.security.header-name=X-API-Key
pricing.security.require-api-key=false

# Default base service fee per country (EUR) when a customer has no contract fee.
# Override per country with e.g. PRICING_COUNTRY_BASE_RATES_GERMANY=155
pricing.default-base-rate=150.00
pricing.country-base-rates.GERMANY=150.00
pricing.country-base-rates.AUSTRIA=160.00

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.persister.entity=ERROR
logging.level.org=WARN
